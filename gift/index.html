<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>礼金登记</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#c49030">
<link rel="apple-touch-icon" href="../logo.jpg">
<link rel="icon" type="image/jpeg" href="../logo.jpg">
<style>
/* ===== 主题变量（与门户一致） ===== */
:root{
  --gold:#c49030;--gold2:#d4a853;--gold-light:rgba(196,144,48,.1);
  --blue:#3b82f6;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --bg:#f8fafc;--bg2:#f1f5f9;--surface:#fff;--surface2:#f8fafc;
  --border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --gold:#d4a853;--gold-light:rgba(212,168,83,.12);
  --blue:#60a5fa;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --bg:#0f1117;--bg2:#1a1d2e;--surface:#1c1f2e;--surface2:#252840;
  --border:#2d3048;--shadow:0 1px 3px rgba(0,0,0,.2);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:48px 20px 40px;
  transition:background .3s,color .3s;
}

/* ===== 主题切换按钮 ===== */
.theme-toggle{
  position:fixed;bottom:20px;right:20px;width:40px;height:40px;
  border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.theme-toggle:hover{background:var(--bg2);color:var(--gold);transform:scale(1.08)}

/* ===== 页面容器 ===== */
.gift-page{width:100%;max-width:1000px;animation:fadeUp .4s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.gift-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.gift-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:18px;cursor:pointer;flex-shrink:0;transition:all .2s}
.gift-back:hover{color:var(--gold);border-color:var(--gold)}
.gift-header h2{font-size:20px;font-weight:700;color:var(--text)}

/* ===== 统计方框 ===== */
.gift-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.gift-stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.gift-stat .lb{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.gift-stat .vl{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.gift-stat.people .vl{color:var(--blue)}
.gift-stat.money .vl{color:var(--gold)}

/* ===== 登记表单 ===== */
.gift-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:22px}
.gift-form-row{display:flex;gap:12px;flex-wrap:wrap}
.gift-field{flex:1;min-width:130px}
.gift-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.gift-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.gift-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-light)}
.gift-time-tip{font-size:12px;color:var(--text3);margin-top:10px}
.gift-btn{padding:10px 24px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.gift-btn:hover{opacity:.9}
.gift-btn-c{padding:10px 20px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text2);font-size:14px;cursor:pointer}
.gift-btn-c:hover{border-color:var(--text3)}

/* ===== 明细列表 ===== */
.gift-list-head{font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.gift-btn-s{padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.gift-btn-s:hover{border-color:var(--gold);color:var(--gold)}
.gift-btn-s.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.gift-list{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto;padding-bottom:8px}
.gift-list.cols-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gift-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:border-color .2s;-webkit-tap-highlight-color:transparent}
.gift-item:hover{border-color:var(--gold)}
/* 禁用文本选择/长按菜单（解决小米浏览器长按弹出“手动标记广告”） */
.gift-item,.gift-item *{-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.gift-item-info{flex:1;min-width:0}
.gift-item-name{font-size:15px;font-weight:600;color:var(--text)}
.gift-item-remarkline{display:flex;align-items:center;gap:8px;margin-top:3px}
.gift-item-remark{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* 地区标签：备注行右端，距右侧金额约 5 个字符（5em=60px，减去条目的 14px 间距） */
.gift-item-region{font-size:12px;font-weight:700;color:#e5484d;flex-shrink:0;margin-left:auto;margin-right:calc(5em - 14px);letter-spacing:.5px}
.gift-item-time{font-size:11px;color:var(--text3);margin-top:3px}
.gift-item-amt{font-size:18px;font-weight:700;color:var(--gold);flex-shrink:0;font-variant-numeric:tabular-nums}
.gift-empty{text-align:center;color:var(--text3);padding:40px 0;font-size:14px}

/* ===== 地区筛选按钮（有地区标签时才显示） ===== */
.gift-region-bar{display:none;gap:6px;flex-wrap:wrap;align-items:center}
.gift-btn-s.region-on{background:#e5484d;border-color:#e5484d;color:#fff}
.gift-btn-s.region-on:hover{color:#fff;border-color:#e5484d}

/* ===== 总金额分栏（筛选地区时一分为二） ===== */
.gift-stat.money{display:flex;align-items:stretch;padding:18px 0}
.gift-stat.money .gift-stat-pane{flex:1 1 0;min-width:0;padding:0 20px}
.gift-stat.money.split .gift-stat-pane.region{border-left:1px solid var(--border)}
.gift-stat.money .gift-stat-pane.region .lb{color:#e5484d;font-weight:600}
.gift-stat.money .gift-stat-pane.region .vl{font-size:22px;color:#e5484d}

/* ===== 编辑弹窗 ===== */
.gift-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.gift-modal.show{display:flex}
.gift-modal-ct{background:var(--surface);border-radius:18px;padding:24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:fadeUp .25s ease-out}
.gift-modal-ct h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px}

/* ===== 右键菜单 ===== */
.gift-context{position:fixed;z-index:1001;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:132px;padding:4px 0;-webkit-user-select:none;user-select:none}
.gift-context-item{padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text)}
.gift-context-item:hover{background:var(--gold-light);color:var(--gold)}
.gift-context-item.danger{color:#ef4444}
.gift-context-item.danger:hover{background:rgba(239,68,68,.08);color:#ef4444}
.gift-context-sep{height:1px;background:var(--border);margin:4px 0}
.gift-context-title{padding:4px 16px 3px;font-size:11px;color:var(--text3);font-weight:600}
.gift-context-item.region:hover{background:rgba(229,72,77,.08);color:#e5484d}
.gift-context-item.region.on{color:#e5484d;font-weight:600;background:rgba(229,72,77,.08)}

/* ===== 标题：长按（手机）/ 右键（PC）打开账号权限管理，禁止长按选中 ===== */
#giftTitle{-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;cursor:default}

/* ===== 账号权限管理弹窗（仅管理员 admin 可打开） ===== */
/* .gift-modal-ct 自身没有高度限制，弹窗靠 .gift-acc 的 flex 列布局 + .gift-acc-bd 自滚兜住超屏 */
.gift-modal-ct.gift-acc{max-width:540px;padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
.gift-acc-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 12px;flex:0 0 auto}
.gift-acc-hd h3{margin-bottom:0}
.gift-acc-x{width:30px;height:30px;flex-shrink:0;border:none;border-radius:8px;background:transparent;color:var(--text2);font-size:22px;line-height:1;cursor:pointer}
.gift-acc-x:hover{background:var(--bg2);color:var(--text)}
.gift-acc-bd{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 24px 20px}
.gift-acc-src{font-size:12px;color:var(--text3);padding:8px 10px;margin-bottom:2px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;line-height:1.5}
.gift-acc-src.warn{color:#b45309;border-color:#fcd34d;background:rgba(251,191,36,.1)}
.gift-acc-sec{border-bottom:1px solid var(--border);padding:16px 0}
.gift-acc-sec:last-of-type{border-bottom:none;padding-bottom:4px}
.gift-acc-sec-t{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.gift-acc-sec-t span{font-weight:400;color:var(--text3)}
.gift-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gift-presets .gift-btn-s.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.gift-acc-actions{display:flex;justify-content:flex-end;margin-top:14px}
.gift-acc-list{display:flex;flex-direction:column;gap:8px}
.gift-acc-item{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.gift-acc-item.expired{opacity:.62}
.gift-acc-item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gift-acc-name{font-size:14px;font-weight:600;color:var(--text);word-break:break-all}
.gift-acc-role{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--gold-light);color:var(--gold);font-weight:600;flex-shrink:0}
.gift-acc-role.user{background:var(--bg2);color:var(--text3);font-weight:400}
.gift-acc-left{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5}
.gift-acc-left.warn{color:#e5484d;font-weight:600}
.gift-acc-item .ops{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.gift-acc-min-input{width:78px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:none}
.gift-acc-min-input:focus{border-color:var(--gold)}
.gift-acc-ops-tip{font-size:12px;color:var(--text3)}
.gift-acc-note{font-size:11px;color:var(--text3);line-height:1.7;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.gift-acc-empty{font-size:12px;color:var(--text3);text-align:center;padding:14px 0}

/* ===== 轻提示 toast ===== */
.gift-toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:1200;background:rgba(15,23,42,.92);color:#fff;font-size:13px;line-height:1.5;padding:9px 16px;border-radius:10px;max-width:86vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.gift-toast.show{opacity:1}

/* ===== 端型分界：PC >700px，手机 ≤700px ===== */
@media(min-width:701px){
  .gift-region-bar.pc.show{display:flex}
  .gift-region-bar.mobile{display:none!important}
}
@media(max-width:700px){
  .gift-region-bar.pc{display:none!important}
  .gift-region-bar.mobile.show{display:flex;margin:0 0 12px}
  .gift-item-region{margin-right:0}
  /* 仅分栏时收紧：半格空间小，避免长金额顶到分隔线 */
  .gift-stat.money.split .gift-stat-pane{padding:0 10px}
  .gift-stat.money.split .gift-stat-pane .vl{font-size:18px}
}

@media(max-width:540px){
  body{padding:20px 14px 30px}
  .gift-stats{gap:10px}
  .gift-stat .vl{font-size:22px}
  .gift-stat.money{padding:14px 0}
  .gift-stat.money.split .gift-stat-pane{padding:0 6px}
  .gift-stat.money.split .gift-stat-pane .vl{font-size:17px}
  /* 账号权限管理弹窗：手机端占满可用宽度，内边距收紧 */
  .gift-modal-ct.gift-acc{max-width:100%;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  .gift-acc-hd{padding:16px 16px 10px}
  .gift-acc-bd{padding:0 16px 16px}
  .gift-toast{bottom:24px;max-width:92vw}
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</button>

<div class="gift-page">
  <div class="gift-header">
    <button class="gift-back" onclick="goBackPortal()" title="返回门户">←</button>
    <h2 id="giftTitle" title="长按（手机）或右键（PC）可进行账号权限管理">礼金登记</h2>
    <button class="gift-btn-s" style="margin-left:auto" onclick="giftLogout()" title="退出登录，下次访问需重新验证">退出登录</button>
  </div>

  <!-- 统计方框 -->
  <div class="gift-stats">
    <div class="gift-stat people">
      <div class="lb">登记人数</div>
      <div class="vl" id="giftPeople">0</div>
    </div>
    <div class="gift-stat money" id="giftMoneyStat">
      <div class="gift-stat-pane">
        <div class="lb">总金额</div>
        <div class="vl" id="giftTotal">¥0</div>
      </div>
      <div class="gift-stat-pane region" id="giftRegionPane" style="display:none">
        <div class="lb" id="giftRegionLabel">地区</div>
        <div class="vl" id="giftRegionAmount">¥0</div>
      </div>
    </div>
  </div>

  <!-- 登记表单 -->
  <div class="gift-form">
    <div class="gift-form-row">
      <div class="gift-field">
        <label>姓名 <span style="color:#ef4444">*</span></label>
        <input id="giftName" maxlength="20" placeholder="请输入姓名" onkeydown="if(event.key==='Enter')saveGiftRecord()">
      </div>
      <div class="gift-field">
        <label>金额（元，整数）<span style="color:#ef4444">*</span></label>
        <input id="giftAmount" type="number" min="0" step="1" placeholder="请输入整数金额" onkeydown="if(event.key==='Enter')saveGiftRecord()">
      </div>
      <div class="gift-field" style="flex:1.4;min-width:160px">
        <label>备注（可选）</label>
        <input id="giftRemark" maxlength="50" placeholder="如：同事 / 亲戚 / 朋友" onkeydown="if(event.key==='Enter')saveGiftRecord()">
      </div>
      <div class="gift-field" style="flex:0 0 auto;display:flex;align-items:flex-end">
        <button class="gift-btn" onclick="saveGiftRecord()">登记</button>
      </div>
    </div>
    <div class="gift-time-tip">登记时间自动记录，无需填写：<span id="giftTimePreview"></span></div>
  </div>

  <!-- 明细列表 -->
  <div class="gift-list-head">
    <span>礼金明细（右键点击条目可修改）</span>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <!-- PC 端：地区筛选按钮（有地区标签时才出现，位于“按2列显示”左侧） -->
      <div class="gift-region-bar pc" id="giftRegionBarPC"></div>
      <button class="gift-btn-s" id="giftColsBtn" onclick="toggleGiftListColumns()">按2列显示</button>
    </div>
  </div>
  <!-- 手机端：地区筛选按钮（标题下一行、列表上方） -->
  <div class="gift-region-bar mobile" id="giftRegionBarMobile"></div>
  <div id="giftList" class="gift-list"><div class="gift-empty">加载中...</div></div>
</div>

<!-- 访问验证弹窗 -->
<div id="giftLogin" class="gift-modal">
  <div class="gift-modal-ct">
    <h3>礼金登记 · 访问验证</h3>
    <div class="gift-form-row" style="flex-direction:column;flex-wrap:nowrap">
      <div class="gift-field">
        <label>账号</label>
        <input id="giftLoginUser" autocomplete="username" onkeydown="if(event.key==='Enter')giftLogin()">
      </div>
      <div class="gift-field">
        <label>密码</label>
        <input id="giftLoginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')giftLogin()">
      </div>
    </div>
    <div id="giftLoginErr" style="color:#ef4444;font-size:12px;margin-top:10px;display:none">账号或密码错误，请重新输入</div>
    <div style="display:flex;justify-content:flex-end;margin-top:18px">
      <button class="gift-btn" onclick="giftLogin()">登 录</button>
    </div>
  </div>
</div>

<!-- 礼金编辑弹窗 -->
<div id="giftEditModal" class="gift-modal">
  <div class="gift-modal-ct">
    <h3>修改礼金记录</h3>
    <div class="gift-form-row" style="flex-direction:column;flex-wrap:nowrap">
      <div class="gift-field">
        <label>姓名 <span style="color:#ef4444">*</span></label>
        <input id="giftEditName" maxlength="20">
      </div>
      <div class="gift-field">
        <label>金额（元，整数）<span style="color:#ef4444">*</span></label>
        <input id="giftEditAmount" type="number" min="0" step="1">
      </div>
      <div class="gift-field">
        <label>备注（可选）</label>
        <input id="giftEditRemark" maxlength="50">
      </div>
    </div>
    <div class="gift-time-tip" style="margin-top:12px">登记时间：<span id="giftEditTime"></span>（不可修改）</div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
      <button class="gift-btn-c" onclick="closeGiftEditModal()">取消</button>
      <button class="gift-btn" onclick="saveGiftEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 账号权限管理弹窗（仅管理员：长按 / 右键「礼金登记」标题打开） -->
<div id="giftAccModal" class="gift-modal">
  <div class="gift-modal-ct gift-acc">
    <div class="gift-acc-hd">
      <h3>账号权限管理</h3>
      <button class="gift-acc-x" onclick="closeGiftAccountModal()" title="关闭">×</button>
    </div>
    <div class="gift-acc-bd">
      <div class="gift-acc-src" id="giftAccSrc">数据源：检测中…</div>

      <!-- 新建账号 -->
      <div class="gift-acc-sec">
        <div class="gift-acc-sec-t">新建账号</div>
        <div class="gift-form-row">
          <div class="gift-field">
            <label>账号</label>
            <input id="giftAccNewUser" maxlength="24" autocomplete="off" placeholder="如 shouli">
          </div>
          <div class="gift-field">
            <label>密码</label>
            <input id="giftAccNewPass" type="text" maxlength="32" autocomplete="off" placeholder="建议 6 位以上">
          </div>
        </div>
        <div class="gift-field" style="margin-top:12px">
          <label>有效时间（分钟，1 ~ 720）</label>
          <input id="giftAccNewMin" type="number" min="1" max="720" step="1" value="60" inputmode="numeric">
        </div>
        <div class="gift-presets" id="giftAccPresets">
          <button class="gift-btn-s" data-min="1">1分钟</button>

function escapeGiftHtml(s) {

function formatGiftTime(iso) {

async function loadGiftRecords() {
  var listEl = document.getElementById('giftList');
  if (giftCloudMode) {
    try {
      var { data, error } = await giftSB.from('gift_records')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      giftRecords = data || [];
    } catch (e) {
      console.error('云端加载礼金记录失败:', e);
      loadGiftRecordsLocal();

    loadGiftRecordsLocal();

function saveGiftRecordsLocal() {
  try { localStorage.setItem(giftLocalKey(), JSON.stringify(giftRecords)); }

// 金额显示：整数 + 千分位
function formatGiftAmount(v) {

// 更新统计方框：登记人数 + 总金额（筛选地区时右侧显示该地区金额）
function updateGiftStats() {

// 渲染明细列表

// 绑定明细右键（PC）与长按（移动端）
function bindGiftItemEvents() {
  // 清除长按产生的文本选中，避免系统/浏览器弹出“复制·搜索·标记广告”菜单
  function clearSelection() {
    try {
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
    } catch (err) {}
  }

  document.querySelectorAll('#giftList .gift-item').forEach(function(item) {
    var longPressTimer = null;
    var isLongPress = false;

    item.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      e.stopPropagation();
      clearSelection();
      showGiftContextMenu(e.clientX, e.clientY, item.getAttribute('data-id'));
    });

    item.addEventListener('touchstart', function(e) {
      isLongPress = false;
      var id = item.getAttribute('data-id');
      var t = e.touches[0];
      var sx = t.clientX, sy = t.clientY;
      longPressTimer = setTimeout(function() {
        longPressTimer = null;
        isLongPress = true;
        clearSelection();
        showGiftContextMenu(sx, sy, id);
      }, 500);
    }, { passive: true });

    // 手指移动 = 滚动，取消长按
    item.addEventListener('touchmove', function() {
      if (!longPressTimer) return;
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }, { passive: true });

    item.addEventListener('touchend', function(e) {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      if (isLongPress) { e.preventDefault(); clearSelection(); }
    });
  });
}

// 右键菜单：修改 / 删除 / 地区标签（大足·永川·东莞）
function showGiftContextMenu(x, y, id) {
  var old = document.getElementById('giftContextMenu');
  if (old) old.remove();

  var rec = giftRecords.find(function(r) { return String(r.id) === String(id); });
  var cur = rec ? rec.region : null;

  var menu = document.createElement('div');
  menu.id = 'giftContextMenu';
  menu.className = 'gift-context';
  var html = '<div class="gift-context-item" data-action="edit">✏️ 修改</div>'
    + '<div class="gift-context-item danger" data-action="delete">🗑 删除</div>'
    + '<div class="gift-context-sep"></div>'
    + '<div class="gift-context-title">地区标签</div>';
  GIFT_REGIONS.forEach(function(name) {
    var on = (cur === name);
    html += '<div class="gift-context-item region' + (on ? ' on' : '') + '" data-region="' + name + '">'
      + '📍 ' + name + (on ? ' ✓' : '') + '</div>';
  });
  menu.innerHTML = html;

  menu.style.visibility = 'hidden';
  document.body.appendChild(menu);

  var mw = menu.offsetWidth || 120, mh = menu.offsetHeight || 220;
  var fx = x, fy = y;
  if (x + mw > window.innerWidth - 4) fx = x - mw;
  if (y + mh > window.innerHeight - 4) fy = y - mh;
  menu.style.left = Math.max(4, fx) + 'px';
  menu.style.top = Math.max(4, fy) + 'px';
  menu.style.visibility = '';

  var closeMenu = function() {
    menu.remove();
    document.removeEventListener('click', onDocClick);
    window.removeEventListener('scroll', closeMenu, true);
  };
  var onDocClick = function(e) {
    if (!menu.contains(e.target)) closeMenu();
  };

  menu.querySelectorAll('.gift-context-item').forEach(function(mi) {
    mi.addEventListener('click', function() {
      var action = mi.getAttribute('data-action');
      var region = mi.getAttribute('data-region');
      closeMenu();
      if (action === 'edit') openGiftEditModal(id);
      else if (action === 'delete') deleteGiftRecord(id);
      else if (region) setGiftRecordRegion(id, region);
    });
  });

  setTimeout(function() {
    document.addEventListener('click', onDocClick);
    window.addEventListener('scroll', closeMenu, true);
  }, 10);
}

// 设置/取消地区标签（再次点击同一地区 = 取消）
async function setGiftRecordRegion(id, region) {
  var rec = giftRecords.find(function(r) { return String(r.id) === String(id); });
  if (!rec) return;
  var next = (rec.region === region) ? null : region;

  if (giftCloudMode) {
    try {
      var { error } = await giftSB.from('gift_records').update({ region: next }).eq('id', id);
      if (error) throw error;
    } catch (e) {
      console.error('地区标签保存失败:', e);
      alert('地区标签保存失败：' + e.message + '\n（请确认 gift_records 表已新增 region 字段）');
      loadGiftRecords();
      return;
    }
  } else {
    rec.region = next;
    saveGiftRecordsLocal();
  }

  loadGiftRecords();
}

// 打开编辑弹窗
function openGiftEditModal(id) {
  var record = giftRecords.find(function(r) { return String(r.id) === String(id); });
  if (!record) return;
  giftEditingId = record.id;
  document.getElementById('giftEditName').value = record.guest_name;
  document.getElementById('giftEditAmount').value = record.amount;
  document.getElementById('giftEditRemark').value = record.remark || '';
  document.getElementById('giftEditTime').textContent = formatGiftTime(record.created_at);
  document.getElementById('giftEditModal').classList.add('show');
}

function closeGiftEditModal() {
  document.getElementById('giftEditModal').classList.remove('show');
  giftEditingId = null;
}

// 保存修改（登记时间保持不变）
async function saveGiftEdit() {
  if (giftEditingId == null) return;
  var name = document.getElementById('giftEditName').value.trim();
  var amount = parseFloat(document.getElementById('giftEditAmount').value);
  var remark = document.getElementById('giftEditRemark').value.trim();

  if (!name) { alert('请输入姓名'); return; }
  if (isNaN(amount) || amount < 0 || Math.floor(amount) !== amount) { alert('请输入有效的整数金额'); return; }

  var patch = { guest_name: name, amount: Math.round(amount), remark: remark };

  if (giftCloudMode) {
    try {
      var { error } = await giftSB.from('gift_records').update(patch).eq('id', giftEditingId);
      if (error) throw error;
    } catch (e) {
      console.error('云端修改失败:', e);
      alert('云端修改失败：' + e.message);
      return;
    }
  } else {
    var idx = giftRecords.findIndex(function(r) { return String(r.id) === String(giftEditingId); });
    if (idx !== -1) giftRecords[idx] = Object.assign({}, giftRecords[idx], patch);
    saveGiftRecordsLocal();
  }

  closeGiftEditModal();
  loadGiftRecords();
}

// 删除记录
async function deleteGiftRecord(id) {
  if (!confirm('确定要删除这条礼金记录吗？')) return;

  if (giftCloudMode) {
    try {
      var { error } = await giftSB.from('gift_records').delete().eq('id', id);
      if (error) throw error;
    } catch (e) {
      console.error('云端删除失败:', e);
      alert('云端删除失败：' + e.message);
      return;
    }
  } else {
    giftRecords = giftRecords.filter(function(r) { return String(r.id) !== String(id); });
    saveGiftRecordsLocal();
  }
  loadGiftRecords();
}

/* ---------- 会话读写 ---------- */
// 读会话；顺带把旧的 gift_auth_ok 迁移成管理员会话，老用户不会被踢下线
function giftGetSession() {
  try {
    var raw = localStorage.getItem(GIFT_SESSION_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.username) return s;
      localStorage.removeItem(GIFT_SESSION_KEY);
    }
    if (localStorage.getItem(GIFT_AUTH_KEY) === '1') {
      var migrated = { username: 'admin', role: 'admin', expiresAt: null, builtin: true, cloud: false };
      localStorage.setItem(GIFT_SESSION_KEY, JSON.stringify(migrated));
      localStorage.removeItem(GIFT_AUTH_KEY);
      return migrated;
    }
  } catch (e) {}
  return null;
}

function giftSetSession(session) {
  try { localStorage.setItem(GIFT_SESSION_KEY, JSON.stringify(session)); } catch (e) {}
}

function giftClearSession() {
  try {
    localStorage.removeItem(GIFT_SESSION_KEY);
    localStorage.removeItem(GIFT_AUTH_KEY);
  } catch (e) {}
}

// 有会话，且（永不过期 或 尚未到期）
function isGiftAuthed() {
  var s = giftGetSession();
  if (!s) return false;
  if (s.expiresAt == null) return true;
  return s.expiresAt - Date.now() > 0;
}

// 是否管理员（内置 admin 或云端 role=admin）——账号管理弹窗的唯一入口条件
function giftIsAdmin() {
  var s = giftGetSession();
  return !!(s && s.role === 'admin');
}

/* ---------- 轻提示 ---------- */
function giftToast(msg, duration) {
  var el = document.getElementById('giftToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'giftToast';
    el.className = 'gift-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  void el.offsetWidth;            // 强制回流，保证连续调用时动画能重放
  el.classList.add('show');
  if (giftToastTimer) clearTimeout(giftToastTimer);
  giftToastTimer = setTimeout(function() { el.classList.remove('show'); }, duration || 2400);
}

/* ---------- 密码哈希 ---------- */
function giftHasSubtleCrypto() {
  return !!(window.crypto && window.crypto.subtle && window.TextEncoder);
}

async function giftDigest(text) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function giftHashPassword(pw) {
  return giftDigest(GIFT_PASS_PREFIX + String(pw == null ? '' : pw));
}

    var list = JSON.parse(localStorage.getItem(GIFT_ACCOUNTS_LOCAL_KEY) || '[]');
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function giftAccountsLocalSet(list) {
  try { localStorage.setItem(GIFT_ACCOUNTS_LOCAL_KEY, JSON.stringify(list || [])); } catch (e) {}
}

// 按账号名查一条记录；查不到返回 null，查询出错向上抛
async function giftFindAccount(username) {
  if (giftCloudMode) {
    var res = await giftSB.from(GIFT_ACCOUNT_TABLE).select('*').eq('username', username).limit(1);
    if (res.error) throw res.error;
    return (res.data && res.data[0]) ? res.data[0] : null;
  }
  var found = giftAccountsLocalGet().filter(function(a) { return a.username === username; })[0];
  return found || null;
}

// 校验账号密码与有效期 → {username,role,expiresAt,cloud} / {expired:true} / null
async function giftAuthenticate(username, password) {
  var account = await giftFindAccount(username);
  if (!account) return null;
  var hash = await giftHashPassword(password);
  if (hash !== account.password_hash) return null;
  if (account.expires_at && Date.parse(account.expires_at) - Date.now() <= 0) return { expired: true };
  return {
    username: account.username,
    role: account.role || 'user',
    expiresAt: account.expires_at ? Date.parse(account.expires_at) : null,
    builtin: false,
    cloud: !!giftCloudMode
  };
}

/* ---------- 登录 / 登出 ---------- */
function giftShowLoginErr(msg) {
  var el = document.getElementById('giftLoginErr');
  if (!el) return;
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'block';
}

// 登录成功的统一收尾
function giftFinishLogin(session) {
  giftSetSession(session);
  giftShowLoginErr(null);
  var passEl = document.getElementById('giftLoginPass');
  if (passEl) passEl.value = '';
  document.getElementById('giftLogin').classList.remove('show');
  giftStartWatch();
  loadGiftRecords();
}

async function giftLogin() {
  var u = document.getElementById('giftLoginUser').value.trim().toLowerCase();
  var p = document.getElementById('giftLoginPass').value;
  if (!u || !p) { giftShowLoginErr('请输入账号和密码'); return; }

  // ① 内置管理员：本地校验优先，断网也能进（应急兜底）
  var builtinOk = false;
  try { builtinOk = (btoa(u) === GIFT_USER_B64 && btoa(p) === GIFT_PASS_B64); } catch (e) {}
  if (builtinOk) {
    giftFinishLogin({ username: 'admin', role: 'admin', expiresAt: null, builtin: true, cloud: false });
    return;
  }

  // ② 云端 / 本地账号表
  if (!giftHasSubtleCrypto()) {
    giftShowLoginErr('当前环境不支持加密计算，请用 https 或 localhost 打开本页');
    return;
  }
  var session = null;
  try {
    session = await giftAuthenticate(u, p);
  } catch (e) {
    console.error('账号校验失败:', e);
    giftShowLoginErr('账号校验失败：' + (e.message || e) + '（请确认已执行 gift_accounts.txt 建表 SQL）');
    return;
  }
  if (session && session.expired) { giftShowLoginErr('该账号已过期，请联系管理员重新授权'); return; }
  if (!session) { giftShowLoginErr('账号或密码错误，请重新输入'); return; }
  giftFinishLogin(session);
}

function giftLogout() {
  if (!confirm('确定退出登录吗？退出后下次访问需要重新输入账号密码。')) return;
  giftStopWatch();
  giftClearSession();
  giftAccExtendId = null;
  closeGiftAccountModal();
  giftRecords = [];
  giftRegionFilter = null;
  renderGiftList();
  updateGiftStats();
  document.getElementById('giftLogin').classList.add('show');
}

/* ---------- 到期检测与强制退出 ---------- */
function giftStopWatch() {
  if (giftExpireTimer) { clearTimeout(giftExpireTimer); giftExpireTimer = null; }
  if (giftWatchTimer) { clearInterval(giftWatchTimer); giftWatchTimer = null; }
}

function giftStartWatch() {
  giftStopWatch();
  var s = giftGetSession();
  if (!s || s.expiresAt == null) return;   // 永久账号不做到期检测
  var left = s.expiresAt - Date.now();
  if (left <= 0) { giftHandleExpired(); return; }
  giftExpireTimer = setTimeout(giftCheckSession, left);    // 精确到点
  giftWatchTimer = setInterval(giftCheckSession, 30000);   // 保底巡检
}

function giftCheckSession() {
  var s = giftGetSession();
  if (!s || s.expiresAt == null) return;
  if (s.expiresAt - Date.now() <= 0) giftHandleExpired();
}

// 强制退出：必须先清会话再刷新，顺序颠倒会反复刷新
function giftHandleExpired() {
  if (giftExpiring) return;
  giftExpiring = true;
  giftStopWatch();
  try { sessionStorage.setItem(GIFT_EXPIRED_NOTICE_KEY, '1'); } catch (e) {}
  giftClearSession();
  location.reload();
}

// 回到前台复核：账号被管理员删除 / 被改短 → 立即失效
// 关键：网络异常绝不误踢，只有「明确查到账号不存在」或「明确已过期」才退出
async function giftRecheckSession() {
  if (giftExpiring) return;
  var s = giftGetSession();
  if (!s || s.builtin || s.expiresAt == null) return;
  if (s.expiresAt - Date.now() <= 0) { giftHandleExpired(); return; }

  var now = Date.now();
  if (now - giftLastRecheck < GIFT_RECHECK_GAP) return;
  giftLastRecheck = now;
  if (!giftCloudMode || s.cloud === false) return;   // 本地模式账号没有跨设备删号一说

  var account = null;
  try {
    account = await giftFindAccount(s.username);
  } catch (e) {
    return;   // 网络或表异常：什么都不做
  }
  if (!account) { giftHandleExpired(); return; }
  if (account.expires_at && Date.parse(account.expires_at) - Date.now() <= 0) giftHandleExpired();
}

/* ---------- 账号权限管理弹窗（仅管理员） ---------- */
function giftTryOpenAccountModal() {
  if (!giftIsAdmin()) { giftToast('仅管理员可进行账号管理'); return; }
  openGiftAccountModal();
}

function openGiftAccountModal() {
  giftAccExtendId = null;
  document.getElementById('giftAccModal').classList.add('show');
  giftRefreshAccountList();
  if (giftAccTimer) clearInterval(giftAccTimer);
  // 打开期间每 30 秒刷新剩余时间（正在延长时跳过，避免输入框被重建清空）
  giftAccTimer = setInterval(function() {
    if (!giftAccExtendId) giftRefreshAccountList();
  }, 30000);
}

function closeGiftAccountModal() {
  var el = document.getElementById('giftAccModal');
  if (el) el.classList.remove('show');
  giftAccExtendId = null;
  if (giftAccTimer) { clearInterval(giftAccTimer); giftAccTimer = null; }
}

async function giftRefreshAccountList() {
  var srcEl = document.getElementById('giftAccSrc');
  var listEl = document.getElementById('giftAccList');
  if (!listEl) return;
  listEl.innerHTML = '<div class="gift-acc-empty">加载中…</div>';

  if (giftCloudMode) {
    try {
      var res = await giftSB.from(GIFT_ACCOUNT_TABLE).select('*').order('created_at', { ascending: true });
      if (res.error) throw res.error;
      giftAccounts = res.data || [];
      if (srcEl) {
        srcEl.className = 'gift-acc-src';
        srcEl.textContent = '数据源：云端（Supabase · gift_accounts），所有设备共用';
      }
      renderGiftAccountList();
      return;
    } catch (e) {
      console.error('云端加载账号失败:', e);
      if (srcEl) {
        srcEl.className = 'gift-acc-src warn';
        srcEl.textContent = '数据源：本地（云端加载失败：' + (e.message || e) + '）'
          + '。请在 Supabase 执行 gift_accounts.txt 建表 SQL，否则账号只在本机有效。';
      }
    }
  } else if (srcEl) {
    srcEl.className = 'gift-acc-src warn';
    srcEl.textContent = '数据源：本地（未连接云端，账号只在本机有效）';
  }

  giftAccounts = giftAccountsLocalGet();
  renderGiftAccountList();
}

// 剩余时间文案
function giftFormatRemaining(expiresAtIso) {
  if (!expiresAtIso) return { text: '永不过期', cls: '' };
  var left = Date.parse(expiresAtIso) - Date.now();
  if (isNaN(left)) return { text: '到期时间异常', cls: '' };
  if (left <= 0) return { text: '已过期', cls: 'warn' };
  var sec = Math.floor(left / 1000);
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var text = '剩余 ' + (h > 0 ? h + '小时' + m + '分' : (m > 0 ? m + '分' + s + '秒' : s + '秒'));
  return { text: text, cls: left <= 60000 ? 'warn' : '' };
}

function renderGiftAccountList() {
  var listEl = document.getElementById('giftAccList');
  var cntEl  = document.getElementById('giftAccCount');
  if (!listEl) return;

  var list = giftAccounts.slice().sort(function(a, b) {
    var aAdmin = a.role === 'admin', bAdmin = b.role === 'admin';
    if (aAdmin !== bAdmin) return aAdmin ? -1 : 1;      // 管理员置顶
    return (Date.parse(a.created_at) || 0) - (Date.parse(b.created_at) || 0);
  });

  if (cntEl) cntEl.textContent = '（共 ' + list.length + ' 个）';
  if (!list.length) {
    listEl.innerHTML = '<div class="gift-acc-empty">暂无账号</div>';
    return;
  }

  listEl.innerHTML = list.map(function(a) {
    var isAdminRow = (a.username === 'admin');
    var rem = giftFormatRemaining(a.expires_at);
    var expiredCls = (a.expires_at && Date.parse(a.expires_at) - Date.now() <= 0) ? ' expired' : '';
    var ops;

    if (isAdminRow) {
      ops = '<div class="ops"><span class="gift-acc-ops-tip">内置管理员：永久有效、不可修改</span></div>';
    } else if (giftAccExtendId === a.id) {
      ops = '<div class="ops">'
        + '<input class="gift-acc-min-input" id="giftAccExtMin" type="number" min="1" max="720" step="1" value="60" inputmode="numeric">'
        + '<span class="gift-acc-ops-tip">分钟后到期</span>'
        + '<button class="gift-btn-s" data-extset="60">1小时</button>'
        + '<button class="gift-btn-s" data-extset="720">12小时</button>'
        + '<button class="gift-btn-s active" data-extok="1">确定</button>'
        + '<button class="gift-btn-s" data-extcancel="1">取消</button>'
        + '</div>';
    } else {
      ops = '<div class="ops">'
        + '<button class="gift-btn-s" data-ext="' + escapeGiftHtml(a.id) + '">延长</button>'
        + '<button class="gift-btn-s" data-del="' + escapeGiftHtml(a.id) + '" data-name="' + escapeGiftHtml(a.username) + '">删除</button>'
        + '</div>';
    }

    return '<div class="gift-acc-item' + expiredCls + '">'
      + '<div class="top">'
      +   '<span class="gift-acc-name">' + escapeGiftHtml(a.username) + '</span>'
      +   '<span class="gift-acc-role' + (isAdminRow ? '' : ' user') + '">' + (isAdminRow ? '管理员' : '普通') + '</span>'
      + '</div>'
      + '<div class="gift-acc-left ' + rem.cls + '">' + rem.text
      +   (a.expires_at ? '（' + formatGiftTime(a.expires_at) + ' 到期）' : '')
      +   (a.created_by ? ' · 由 ' + escapeGiftHtml(a.created_by) + ' 创建' : '')
      + '</div>'
      + ops
      + '</div>';
  }).join('');
}

function giftSyncPresetButtons() {
  var inp = document.getElementById('giftAccNewMin');
  var cur = inp ? inp.value : '';
  document.querySelectorAll('#giftAccPresets button[data-min]').forEach(function(b) {
    b.classList.toggle('on', b.getAttribute('data-min') === String(cur));
  });
}

/* ---------- 新建 / 延长 / 删除 ---------- */
async function giftCreateAccount() {
  if (!giftIsAdmin()) { giftToast('仅管理员可操作'); return; }

  var userEl = document.getElementById('giftAccNewUser');
  var passEl = document.getElementById('giftAccNewPass');
  var minEl  = document.getElementById('giftAccNewMin');
  var username = (userEl.value || '').trim().toLowerCase();
  var password = passEl.value || '';
  var minutes  = parseInt(minEl.value, 10);

  if (!/^[a-z0-9_-]{2,24}$/.test(username)) {
    giftToast('账号只能用 2~24 位小写字母、数字、下划线或短横线');
    userEl.focus();
    return;
  }
  if (username === 'admin') { giftToast('admin 是内置管理员账号，请换一个名字'); userEl.focus(); return; }
  if (password.length < 4) { giftToast('密码至少 4 位'); passEl.focus(); return; }
  if (isNaN(minutes) || minutes < GIFT_MIN_MINUTES || minutes > GIFT_MAX_MINUTES) {
    giftToast('有效时间需在 ' + GIFT_MIN_MINUTES + ' ~ ' + GIFT_MAX_MINUTES + ' 分钟之间（最长 12 小时）');
    minEl.focus();
    return;
  }
  if (!giftHasSubtleCrypto()) { giftToast('当前环境不支持加密计算，无法创建账号'); return; }

  var record = {
    username: username,
    password_hash: await giftHashPassword(password),
    role: 'user',
    expires_at: new Date(Date.now() + minutes * 60000).toISOString(),
    created_by: (giftGetSession() || {}).username || 'admin'
  };

  var savedCloud = false;
  if (giftCloudMode) {
    try {
      var res = await giftSB.from(GIFT_ACCOUNT_TABLE).insert(record).select();
      if (res.error) throw res.error;
      savedCloud = true;
    } catch (e) {
      console.error('云端创建账号失败:', e);
      if (/duplicate|unique/i.test(e.message || '')) {
        giftToast('账号「' + username + '」已存在');
        return;
      }
      giftToast('云端创建失败，已存到本机（' + (e.message || e) + '）');
    }
  }

  if (!savedCloud) {
    var local = giftAccountsLocalGet();
    if (local.some(function(a) { return a.username === username; })) {
      giftToast('账号「' + username + '」已存在');
      return;
    }
    record.id = 'local-' + Date.now();
    record.created_at = new Date().toISOString();
    local.push(record);
    giftAccountsLocalSet(local);
  }

  userEl.value = '';
  passEl.value = '';
  giftToast('账号「' + username + '」已创建，' + minutes + ' 分钟后失效', 3200);
  giftRefreshAccountList();
}

async function giftExtendAccount(id, minutes) {
  if (!giftIsAdmin()) { giftToast('仅管理员可操作'); return; }
  if (!id) return;
  if (isNaN(minutes) || minutes < GIFT_MIN_MINUTES || minutes > GIFT_MAX_MINUTES) {
    giftToast('有效时间需在 ' + GIFT_MIN_MINUTES + ' ~ ' + GIFT_MAX_MINUTES + ' 分钟之间（最长 12 小时）');
    return;
  }
  var target = giftAccounts.filter(function(a) { return String(a.id) === String(id); })[0];
  if (target && target.username === 'admin') { giftToast('内置管理员永久有效，无需延长'); return; }

  var expiresAtIso = new Date(Date.now() + minutes * 60000).toISOString();
  var doneCloud = false;
  if (giftCloudMode) {
    try {
      var res = await giftSB.from(GIFT_ACCOUNT_TABLE).update({ expires_at: expiresAtIso }).eq('id', id).select();
      if (res.error) throw res.error;
      doneCloud = true;
    } catch (e) {
      console.error('云端延长失败:', e);
      giftToast('云端更新失败，已改到本机（' + (e.message || e) + '）');
    }
  }
  if (!doneCloud) {
    var local = giftAccountsLocalGet();
    local.forEach(function(a) { if (String(a.id) === String(id)) a.expires_at = expiresAtIso; });
    giftAccountsLocalSet(local);
  }

  giftAccExtendId = null;
  giftToast('已延长：' + minutes + ' 分钟后失效', 3200);
  giftRefreshAccountList();
}

async function giftDeleteAccount(id, username) {
  if (!giftIsAdmin()) { giftToast('仅管理员可操作'); return; }
  if (username === 'admin') { giftToast('内置管理员不可删除'); return; }
  if (!confirm('确定删除账号「' + username + '」吗？\n该账号会立即失效，正在使用的人下次回到页面时会被退出。')) return;

  var doneCloud = false;
  if (giftCloudMode) {
    try {
      var res = await giftSB.from(GIFT_ACCOUNT_TABLE).delete().eq('id', id);
      if (res.error) throw res.error;
      doneCloud = true;
    } catch (e) {
      console.error('云端删除失败:', e);
      giftToast('云端删除失败，已从本机移除（' + (e.message || e) + '）');
    }
  }
  if (!doneCloud) {
    var local = giftAccountsLocalGet().filter(function(a) { return String(a.id) !== String(id); });
    giftAccountsLocalSet(local);
  }

  giftAccExtendId = null;
  giftToast('已删除账号「' + username + '」');
  giftRefreshAccountList();
}

/* ---------- 弹窗事件绑定（一次性） ---------- */
function bindGiftAccountEvents() {
  var presetsEl = document.getElementById('giftAccPresets');
  if (presetsEl) {
    presetsEl.addEventListener('click', function(e) {
      var b = e.target.closest('button[data-min]');
      if (!b) return;
      var inp = document.getElementById('giftAccNewMin');
      if (inp) inp.value = b.getAttribute('data-min');
      giftSyncPresetButtons();
    });
  }

  var minInp = document.getElementById('giftAccNewMin');
  if (minInp) minInp.addEventListener('input', giftSyncPresetButtons);

  var listEl = document.getElementById('giftAccList');
  if (listEl) {
    listEl.addEventListener('click', function(e) {
      var t = e.target.closest('button');
      if (!t) return;
      if (t.hasAttribute('data-ext')) {
        giftAccExtendId = t.getAttribute('data-ext');
        renderGiftAccountList();
        return;
      }
      if (t.hasAttribute('data-extcancel')) {
        giftAccExtendId = null;
        renderGiftAccountList();
        return;
      }
      if (t.hasAttribute('data-extset')) {
        var setInp = document.getElementById('giftAccExtMin');
        if (setInp) setInp.value = t.getAttribute('data-extset');
        return;
      }
      if (t.hasAttribute('data-extok')) {
        var inp = document.getElementById('giftAccExtMin');
        giftExtendAccount(giftAccExtendId, inp ? parseInt(inp.value, 10) : NaN);
        return;
      }
      if (t.hasAttribute('data-del')) {
        giftDeleteAccount(t.getAttribute('data-del'), t.getAttribute('data-name'));
      }
    });
  }

  // 点击遮罩空白处关闭
  var modal = document.getElementById('giftAccModal');
  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeGiftAccountModal();
    });
  }
}

/* ---------- 标题长按（手机）/ 右键（PC）打开账号管理 ---------- */
function bindGiftTitleLongPress() {
  var el = document.getElementById('giftTitle');
  if (!el) return;
  var timer = null;
  var fired = false;

  function clearSel() {
    try {
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
    } catch (e) {}
  }
  function cancel() {
    if (timer) { clearTimeout(timer); timer = null; }
  }

  el.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    clearSel();
    giftTryOpenAccountModal();
  });

  el.addEventListener('touchstart', function() {
    fired = false;
    cancel();
    timer = setTimeout(function() {
      timer = null;
      fired = true;
      clearSel();
      giftTryOpenAccountModal();
    }, 600);
  }, { passive: true });

  el.addEventListener('touchmove', cancel, { passive: true });
  el.addEventListener('touchcancel', cancel, { passive: true });
  el.addEventListener('touchend', function(e) {
    cancel();
    if (fired) { e.preventDefault(); clearSel(); }
  });
}

/* ==================== 明细列表列数切换（默认1列） ==================== */
function toggleGiftListColumns() {
  var list = document.getElementById('giftList');
  var btn = document.getElementById('giftColsBtn');
  if (!list || !btn) return;
  var to2 = !list.classList.contains('cols-2');
  list.classList.toggle('cols-2', to2);
  btn.classList.toggle('active', to2);
  btn.textContent = to2 ? '按1列显示' : '按2列显示';
}

/* ==================== 页面初始化 ==================== */
// 先验证身份，通过后才加载数据
refreshGiftTimePreview();
bindGiftTitleLongPress();
bindGiftAccountEvents();

// 上一次会话是被「到期」踢出的，或关页面期间已经到期 → 给一次提示
var giftExpiredNotice = '';
try {
  giftExpiredNotice = sessionStorage.getItem(GIFT_EXPIRED_NOTICE_KEY) || '';
  if (giftExpiredNotice) sessionStorage.removeItem(GIFT_EXPIRED_NOTICE_KEY);
} catch (e) {}
var giftBootSession = giftGetSession();
if (giftExpiredNotice) {
  giftToast('登录已过期，请重新登录', 3200);
} else if (giftBootSession && giftBootSession.expiresAt != null && !isGiftAuthed()) {
  giftClearSession();
  giftToast('登录已过期，请重新登录', 3200);
}

if (isGiftAuthed()) {
  giftStartWatch();
  loadGiftRecords();
} else {
  document.getElementById('giftLogin').classList.add('show');
  document.getElementById('giftList').innerHTML = '<div class="gift-empty">请先登录后查看礼金明细</div>';
}

// 回到前台 / 窗口重新聚焦 / bfcache 恢复时复核会话（账号被删或已过期 → 立即退出）
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) giftRecheckSession();
});
window.addEventListener('focus', giftRecheckSession);
window.addEventListener('pageshow', giftRecheckSession);
</script>
